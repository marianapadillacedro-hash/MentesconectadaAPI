<!DOCTYPE html>
<html lang="es-MX">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <meta name="theme-color" content="#172333">
    <link rel="manifest" href="manifest.json">
    <link rel="icon" href="assets/icon-192.png" type="image/png">
    <link rel="stylesheet" href="css/styles.css">
    <title>Consulta de guías | Mentes Conectadas</title>
</head>
<body>
    <div id="encabezado"></div>
    <main class="page">
        <div class="container">
            <div class="content-head">
                <h1 class="section-title">Consulta general de guías</h1>
                <p class="section-text">Registros obtenidos desde SQL Server mediante la API.</p>
            </div>
            <div id="mensajeGuias" class="login-error" role="alert" hidden></div>
            <div class="tabla-contenedor">
                <table class="tabla-guias">
                    <thead>
                        <tr><th>ID</th><th>Título</th><th>Categoría</th><th>Neurodivergencia</th></tr>
                    </thead>
                    <tbody id="tablaGuiasCuerpo"></tbody>
                </table>
            </div>
            <p id="contadorGuias" class="tabla-estado"></p>
        </div>
    </main>
    <div id="pie"></div>
    <div id="toast" class="toast" role="status" aria-live="polite"></div>
    <script src="js/config.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/comun.js"></script>
    <script src="js/consulta-guias.js"></script>
</body>
</html>
