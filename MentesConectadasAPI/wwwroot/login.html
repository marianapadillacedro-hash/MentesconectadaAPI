<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#172333">
<meta name="description" content="Mentes Conectadas - información y orientación práctica sobre neurodivergencia en el entorno universitario.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="stylesheet" href="css/styles.css">
<title>Iniciar sesión | Mentes Conectadas</title>
</head>
<body>
<div id="encabezado"></div>
<main class="auth-page login-fondo"><section class="auth-card">
  <h1>Iniciar sesión</h1>
  <p>Ingresa a tu cuenta para consultar y guardar guías prácticas.</p>
  <div id="mensajeLogin" class="login-error" role="alert" hidden></div>
  <form id="formLogin" class="form">
    <div class="field"><label for="login-email">Correo electrónico</label><input id="login-email" type="email" required placeholder="Correo electrónico" autocomplete="username"></div>
    <div class="field"><label for="login-pass">Contraseña</label><input id="login-pass" type="password" required placeholder="Contraseña" autocomplete="current-password"></div>
    <button id="btnLogin" class="btn btn-blue" type="submit">INICIAR SESIÓN</button>
  </form>
  <div class="auth-footer">¿No tienes una cuenta? <button onclick="go('registro')">REGÍSTRATE</button></div>
  <div class="demo-access"><strong>Acceso de demostración</strong><br>Correo: adminMentesConectadas@gmail.com<br>Contraseña: Mentes123*</div>
</section></main>
<div id="pie"></div>
<script src="contenido-data.js"></script>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/comun.js"></script>
<script src="js/login.js"></script>
</body>
</html>
