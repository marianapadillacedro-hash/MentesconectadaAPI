<!DOCTYPE html>
<html lang="es-MX">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="theme-color" content="#172333">
<meta name="description" content="Mentes Conectadas - información y orientación práctica sobre neurodivergencia en el entorno universitario.">
<link rel="manifest" href="manifest.json">
<link rel="icon" href="assets/icon-192.png" type="image/png">
<link rel="stylesheet" href="css/styles.css">
<title>Crear cuenta | Mentes Conectadas</title>
</head>
<body>
<div id="encabezado"></div>
<main class="auth-page"><section class="auth-card">
  <h1>Crear una cuenta</h1>
  <p>Regístrate para consultar información y guardar guías prácticas.</p>
  <form id="formRegistro" class="form">
    <div class="field"><label>Nombre completo</label><input id="reg-name" required placeholder="Nombre completo"></div>
    <div class="field"><label>Correo electrónico</label><input id="reg-email" type="email" required placeholder="Correo electrónico"></div>
    <div class="field"><label>Contraseña</label><input id="reg-pass" type="password" minlength="6" required placeholder="Contraseña"></div>
    <div class="field"><label>Confirmar contraseña</label><input id="reg-pass2" type="password" minlength="6" required placeholder="Confirmar contraseña"></div>
    <div class="field"><label>Tipo de usuario</label><select id="reg-type" required><option value="">Selecciona una opción</option><option>Estudiante</option><option>Docente</option><option>Personal académico</option></select></div>
    <button class="btn btn-blue" type="submit">CREAR CUENTA</button>
  </form>
  <div class="auth-footer">¿Ya tienes una cuenta? <button onclick="go('login')">INICIAR SESIÓN</button></div>
</section></main>
<div id="pie"></div>
<script src="contenido-data.js"></script>
<div id="toast" class="toast" role="status" aria-live="polite"></div>
<script src="js/config.js"></script>
<script src="js/auth.js"></script>
<script src="js/comun.js"></script>
<script src="js/registro.js"></script>
</body>
</html>
